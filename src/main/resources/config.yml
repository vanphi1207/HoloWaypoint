# Marker is clamped to this many blocks from the player's eyes when the
# target is further away (keep below the server's entity tracking range).
max-render-distance: 24.0

# Height above the waypoint where the icon floats.
marker-height: 1.5

# Auto-untrack when the player gets this close.
arrive-distance: 2.0

# How often markers are refreshed (ticks). 1 keeps the edge marker smooth.
update-interval-ticks: 1

# --- Interpolation ----------------------------------------------------------
# Number of ticks the client uses to glide a marker (position and scale) between
# two updates instead of snapping. 0 = automatic (matches update-interval-ticks),
# max 59. Raise to 2-3 for extra smoothness at the cost of a little latency.
interpolation-ticks: 3

# --- Screen-edge indicator -------------------------------------------------
# When the target is off-screen the marker is pinned to the screen border and
# slides around it, pointing the way. Plugins cannot draw real HUD, so this is
# emulated with a hologram a few blocks in front of the camera.
edge-indicator: true

# How far in front of the camera the edge marker floats (blocks).
edge-distance: 3.0

# Follow speed for an off-screen marker, in response units per second.
# Higher values follow faster; 0 disables smoothing.
edge-smoothing-speed: 12.0

# How many ticks ahead the camera (position + look direction) is predicted for the
# off-screen marker. Compensates the one-tick lag between the server and the
# player's camera. 0 disables prediction; try 0.5-2.0 if it overshoots or lags.
edge-lookahead-ticks: 1.0

# Half size of the "screen" rectangle, in tangent units (offset / depth).
# Lower values keep the marker further inside the screen; raise them if it
# sits too far from the border. Depends on the player's FOV and window ratio.
edge-half-width: 1.0
edge-half-height: 0.55

# Keep edge markers and the target marker's text inside this fraction of the
# configured screen rectangle. Lower this if markers still touch the screen edge.
edge-safe-area: 0.82

# Marker size while on the edge.
edge-scale: 0.7

# Draw a directional arrow while the marker is on the edge.
# The selected external resource pack must include HoloWaypoint's edge glyphs.
edge-arrow: true

# --- Resource pack -----------------------------------------------------------
# HoloWaypoint does not host or send resource packs. Merge its icon font into a
# pack hosted by Nexo, ItemsAdder, or Oraxen.
# The font key is holowaypoint:icons, with U+E000 for waypoint and U+E100-U+E10F
# for edge directions; the older source refers to assets/holowaypoint/font/icons.json.
resource-pack:
  # auto, nexo, itemsadder, oraxen. Auto uses the first enabled supported host.
  host: auto
