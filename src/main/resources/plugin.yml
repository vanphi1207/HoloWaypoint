name: HoloWaypoint
version: 1.0.0
main: dev.para.holowaypoint.HoloWaypointPlugin
api-version: '1.21'
description: Hologram-style waypoint markers with distance
softdepend: [Nexo, ItemsAdder, Oraxen]
commands:
  hwp:
    description: Manage hologram waypoints
    usage: /hwp <add|remove|list|track|untrack|message|reload>
    aliases: [holowp]
permissions:
  holowaypoint.use:
    description: Track waypoints for yourself
    default: true
  holowaypoint.admin:
    description: Create/remove waypoints and track them for other players
    default: op